name: longevity
description: AEG Longevity Platform — Deterministic Biological Orchestration
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.4.3
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  intl: ^0.19.0
  http: ^1.2.2
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  dartz: ^0.10.1
  sqflite: ^2.4.3
  path: ^1.9.0
  health: ^13.3.1
  permission_handler: ^13.0.1
  google_generative_ai: ^0.4.7
  camera: ^0.12.0+2
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  firebase_auth: ^6.6.1
  flutter_launcher_icons: ^0.14.4
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/welloa.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/welloa.jpeg"
  remove_alpha_ios: true
